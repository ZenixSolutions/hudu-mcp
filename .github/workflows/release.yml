name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest

    # `secrets` is not an allowed context in a step-level `if` — the permitted
    # list is github, needs, strategy, matrix, job, runner, env, vars, steps and
    # inputs. Lifting the secret into job-level env is the supported way to
    # branch on whether it is set, because `env` *is* allowed there. Referencing
    # secrets directly in an `if` does not fail the step; it fails the whole
    # workflow file to parse, which reports as "this run likely failed because
    # of a workflow file issue" with no logs at all.
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    permissions:
      contents: read
      # Required for npm trusted publishing. GitHub mints a short-lived OIDC
      # token that npm exchanges for publish rights, so this repository holds no
      # npm credential at all — there is no standing token to leak, rotate, or
      # have stolen along with the repository. It also makes provenance
      # automatic: npm attests which workflow and which commit produced the
      # tarball, without the --provenance flag.
      #
      # This requires a trusted publisher to be configured on npmjs.com for
      # @zenixsolutions/hudu-mcp, naming this repository and this workflow file.
      # It cannot be configured from here, and a misconfiguration only surfaces
      # at publish time — see the failure guidance on the publish step.
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Node 22.14+ and npm 11.5.1+ are the floor for trusted publishing. The
      # npm bundled with a given Node release lags, so it is upgraded explicitly
      # rather than assumed.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Pinned to a major, not @latest. Trusted publishing needs 11.5.1+ and the
      # npm bundled with Node 22 is 10.x, so an upgrade is unavoidable — but
      # @latest silently moved this job to npm 12, whose `npm pack --json`
      # returns an object where 10 and 11 returned an array. That broke the
      # packaging test in the release job and nowhere else. A release workflow
      # should not be the first place a new npm major gets exercised.
      - name: Upgrade npm to a version that supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Resolve the version from the tag
        id: version
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${tag}' is not a vX.Y.Z release tag."
            exit 1
          fi

          declared="$(node -p "require('./package.json').version")"

          if [ "$version" != "$declared" ]; then
            echo "::error::Tag '${tag}' does not match the version in package.json ('${declared}'). Bump package.json and re-tag."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}."

      # Runs before npm ci: the script uses only Node built-ins, so an unfinished
      # changelog fails in seconds rather than after a full install and build.
      - name: Check the changelog section for this version
        run: npm run check:changelog -- "${{ steps.version.outputs.version }}"

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      # A dry run first, so a packaging mistake fails before anything is
      # published. A version number on npm can never be reused, so the cheapest
      # place to catch a bad tarball is here.
      - name: Inspect the tarball that would be published
        run: npm publish --dry-run --access public

      # Two publish paths, and which one runs is decided by whether an NPM_TOKEN
      # secret exists.
      #
      # Trusted publishing is the one we want, and it is what runs once the
      # package exists. It cannot do a *first* publish: a trusted publisher is
      # configured in a package's settings on npmjs.com, and a package that has
      # never been published has no settings page. We established that the hard
      # way — the first v0.1.0 attempt reached npm and was refused with
      # `404 ... could not be found or you do not have permission`, which is what
      # an anonymous PUT for a nonexistent name looks like. npm's documentation
      # does not cover the first-publish case.
      #
      # So: add a granular NPM_TOKEN secret scoped to this package for the
      # initial release, configure the trusted publisher once the package page
      # exists, then delete the secret. From then on this job authenticates with
      # nothing at all.
      - name: Publish to npm (trusted publishing)
        id: publish_oidc
        if: env.HAS_NPM_TOKEN != 'true'
        run: npm publish --access public

      - name: Publish to npm (token, for a first release only)
        id: publish_token
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "::warning::Publishing with a stored NPM_TOKEN rather than trusted publishing."
          echo "::warning::Once this release lands, add the trusted publisher on the package's npmjs.com settings"
          echo "::warning::(GitHub Actions: ZenixSolutions / hudu-mcp / release.yml) and delete the NPM_TOKEN secret."
          npm publish --access public --provenance

      - name: Explain a publish failure
        if: failure() && (steps.publish_oidc.outcome == 'failure' || steps.publish_token.outcome == 'failure')
        run: |
          echo "::error::Publish failed. Nothing was published, so this version number is still free."
          echo "::error::A 404 'could not be found or you do not have permission' on a package that does not exist yet"
          echo "::error::means neither authentication path was available: no NPM_TOKEN secret, and no trusted publisher"
          echo "::error::(which cannot be configured until the package exists). Add a granular NPM_TOKEN scoped to this"
          echo "::error::package, delete the tag, and re-push it."
          echo "::error::If the package DOES exist, check the trusted publisher on npmjs.com names this repository"
          echo "::error::and this workflow filename exactly: ZenixSolutions / hudu-mcp / release.yml."
