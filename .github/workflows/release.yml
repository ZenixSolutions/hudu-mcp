name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm trusted publishing. GitHub mints a short-lived OIDC
      # token that npm exchanges for publish rights, so this repository holds no
      # npm credential at all — there is no standing token to leak, rotate, or
      # have stolen along with the repository. It also makes provenance
      # automatic: npm attests which workflow and which commit produced the
      # tarball, without the --provenance flag.
      #
      # This requires a trusted publisher to be configured on npmjs.com for
      # @zenixsolutions/hudu-mcp, naming this repository and this workflow file.
      # It cannot be configured from here, and a misconfiguration only surfaces
      # at publish time — see the failure guidance on the publish step.
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Node 22.14+ and npm 11.5.1+ are the floor for trusted publishing. The
      # npm bundled with a given Node release lags, so it is upgraded explicitly
      # rather than assumed.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Pinned to a major, not @latest. Trusted publishing needs 11.5.1+ and the
      # npm bundled with Node 22 is 10.x, so an upgrade is unavoidable — but
      # @latest silently moved this job to npm 12, whose `npm pack --json`
      # returns an object where 10 and 11 returned an array. That broke the
      # packaging test in the release job and nowhere else. A release workflow
      # should not be the first place a new npm major gets exercised.
      - name: Upgrade npm to a version that supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Resolve the version from the tag
        id: version
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${tag}' is not a vX.Y.Z release tag."
            exit 1
          fi

          declared="$(node -p "require('./package.json').version")"

          if [ "$version" != "$declared" ]; then
            echo "::error::Tag '${tag}' does not match the version in package.json ('${declared}'). Bump package.json and re-tag."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}."

      # Runs before npm ci: the script uses only Node built-ins, so an unfinished
      # changelog fails in seconds rather than after a full install and build.
      - name: Check the changelog section for this version
        run: npm run check:changelog -- "${{ steps.version.outputs.version }}"

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      # A dry run first, so a packaging mistake fails before anything is
      # published. A version number on npm can never be reused, so the cheapest
      # place to catch a bad tarball is here.
      - name: Inspect the tarball that would be published
        run: npm publish --dry-run --access public

      - name: Publish to npm
        id: publish
        run: npm publish --access public

      - name: Explain a publish failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::Publish failed. The usual cause on a first release is that no trusted publisher is configured."
          echo "::error::On npmjs.com, open the package settings for @zenixsolutions/hudu-mcp (or the org's package settings if it does not exist yet)"
          echo "::error::and add a GitHub Actions trusted publisher: organization ZenixSolutions, repository hudu-mcp, workflow release.yml."
          echo "::error::Then delete the tag and re-push it. Nothing was published, so the version number is still free."
