version: 2

updates:
  # Runtime dependencies are deliberately limited to @modelcontextprotocol/sdk
  # and zod. Grouping keeps that small surface to one pull request a week instead
  # of one per package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    labels:
      - dependencies
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - '*'
