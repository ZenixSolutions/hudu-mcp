version: 2

updates:
  # Runtime dependencies are deliberately limited to @modelcontextprotocol/sdk
  # and zod. Grouping keeps that small surface to one pull request a week instead
  # of one per package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    labels:
      - dependencies
    groups:
      # These two families have internal peer constraints, so a major has to
      # move as a set or not at all. Dependabot's default is one pull request
      # per package, which split vitest 4 from @vitest/coverage-v8 4 and left
      # both PRs failing `npm ci` on a peer conflict with the half that had not
      # moved — a failure that looks like the upgrade being broken when it is
      # only incomplete. These groups carry `update-types` deliberately
      # unset, so they cover majors too.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - 'eslint-config-*'
          - 'eslint-plugin-*'

      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - '*'
